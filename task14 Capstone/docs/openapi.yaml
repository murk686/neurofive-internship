openapi: 3.0.3
info:
  title: Event Booking API
  version: 1.0.0
  description: >
    A production-ready backend for an event booking platform. Organizers publish
    events; attendees browse and book seats. Includes JWT auth, role-based access
    control, pagination/filtering/search, and concurrency-safe seat booking.
servers:
  - url: /api
    description: Current server
tags:
  - name: Auth
  - name: Events
  - name: Bookings

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [attendee, organizer] }
        createdAt: { type: string, format: date-time }
    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizerId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        category: { type: string }
        location: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        capacity: { type: integer }
        seatsRemaining: { type: integer }
        price: { type: number, format: float }
        status: { type: string, enum: [draft, published, cancelled] }
        coverImageUrl: { type: string, nullable: true }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        seats: { type: integer }
        totalPrice: { type: number, format: float }
        status: { type: string, enum: [confirmed, cancelled] }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but not permitted to perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Jane Doe }
                email: { type: string, example: jane@example.com }
                password: { type: string, example: SuperSecret123 }
                role: { type: string, enum: [attendee, organizer], example: attendee }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Email already registered }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Login successful }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /events:
    get:
      tags: [Events]
      summary: List published events (paginated, filterable, searchable)
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: location
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
          description: Matches against title and description
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
        - in: query
          name: sortBy
          schema: { type: string, enum: [startTime, price, createdAt] }
        - in: query
          name: order
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200': { description: List of events with pagination meta }
    post:
      tags: [Events]
      summary: Create an event (organizer only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, location, startTime, endTime, capacity]
              properties:
                title: { type: string }
                description: { type: string }
                category: { type: string }
                location: { type: string }
                startTime: { type: string, format: date-time }
                endTime: { type: string, format: date-time }
                capacity: { type: integer }
                price: { type: number }
                status: { type: string, enum: [draft, published, cancelled] }
      responses:
        '201': { description: Event created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{id}:
    get:
      tags: [Events]
      summary: Get a single event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Event detail }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Events]
      summary: Update an event (organizer who owns it only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Event updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Events]
      summary: Delete an event (organizer who owns it only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Event deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{id}/cover-image:
    post:
      tags: [Events]
      summary: Upload a cover image for an event (organizer who owns it only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WEBP, max 5MB
      responses:
        '200': { description: Event updated with new coverImageUrl }
        '400': { description: Missing file or unsupported file type }
        '403': { $ref: '#/components/responses/Forbidden' }

  /events/{id}/bookings:
    post:
      tags: [Bookings]
      summary: Book seats for an event (any authenticated user)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '201': { description: Booking confirmed }
        '409': { description: Not enough seats remaining }
    get:
      tags: [Bookings]
      summary: List all bookings for an event (organizer who owns it only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: List of bookings for this event }
        '403': { $ref: '#/components/responses/Forbidden' }

  /bookings/me:
    get:
      tags: [Bookings]
      summary: List the authenticated user's own bookings
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [confirmed, cancelled] }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer }
      responses:
        '200': { description: List of the caller's bookings }

  /bookings/{id}:
    delete:
      tags: [Bookings]
      summary: Cancel a booking owned by the authenticated user
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Booking cancelled, seats restored to the event.
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

